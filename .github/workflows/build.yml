name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances Python
        run: python3 -m pip install garmin-fit-sdk fitdecode
      - name: Build and run tests
        run: make test
